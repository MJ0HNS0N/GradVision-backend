[project]
name = "gradvision-backend"
version = "0.1.0"
description = "Backend server implementation for GradVision."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
